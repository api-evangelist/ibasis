aid: ibasis
name: iBasis
description: 'iBasis is a global communications solutions provider serving mobile
  operators, MVNOs, over-the-top players, and IoT device companies worldwide. Its
  portfolio spans international and managed voice, 5G data roaming and roaming
  hub/breakout, A2P and RCS messaging monetization, and IoT connectivity built on
  eSIM technology, the Simfony connectivity-management platform, MVNO-as-a-Service,
  and fixed wireless access. iBasis also offers signaling and fraud security
  (FraudLock iQ360, Security iQ360, Signaling Vulnerability Scanner) and business
  intelligence for carriers. Customer and partner operations run through the eCare
  portal behind single sign-on; iBasis does not currently publish a public developer
  program, OpenAPI specifications, or SDKs. This profile was surfaced as a portfolio
  company of CRV and enriched from the public iBasis web presence and live domain
  probes.'
